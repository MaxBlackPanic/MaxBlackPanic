# XcodeGen spec for Ascendant Echoes.
#
# Generate the Xcode project with:
#     brew install xcodegen   # one-time
#     cd AscendantEchoes
#     xcodegen generate
#     open AscendantEchoes.xcodeproj
#
# This avoids checking a fragile .pbxproj into git and lets the project
# be regenerated deterministically on any machine.

name: AscendantEchoes
options:
  bundleIdPrefix: com.resonant.ascendantechoes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AscendantEchoes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_FILE: Sources/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.resonant.ascendantechoes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SWIFT_STRICT_CONCURRENCY: minimal

  AscendantEchoesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: AscendantEchoes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.resonant.ascendantechoes.tests
